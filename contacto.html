<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Sugerencias - Instituto F.D.R.</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="page-wrapper">
        <main class="contact-card">
            
            <div class="card-info">
                <div class="logo-container">
                    <img src="IMAGENES/FranklinDelano.jpg" alt="Logo Instituto Franklin Delano Roosevelt" class="logo-colegio">
                </div>
                <h2>Contacto y Sugerencias</h2>
                <p>Complete el formulario con sus datos institucionales y nos pondremos en contacto a la brevedad.</p>
            </div>

            <!-- Columna Derecha: Formulario de Entrada -->
            <form class="formulario-horizontal" action="contacto.php" method="POST">
                
                <div class="form-group">
                    <label>Nombre completo *</label>
                    <input type="text" name="nombre" required>
                </div>

                <div class="form-group">
                    <label>Correo electrónico *</label>
                    <input type="email" name="correo" required>
                </div>

                <div class="form-group">
                    <label>Número de teléfono</label>
                    <input type="tel" name="telefono">
                </div>

                <div class="form-group">
                    <label>Tipo de mensaje *</label>
                    <select name="tipoMensaje" required>
                        <option value="">Seleccione una opción</option>
                        <option value="Consulta">Consulta</option>
                        <option value="Sugerencia">Sugerencia</option>
                        <option value="Reporte">Reporte</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Mensaje *</label>
                    <textarea name="mensaje" rows="3" placeholder="Escribe aquí tu mensaje..." required></textarea>
                </div>

                <div class="form-actions full-width">
                    <button type="submit" class="submit-btn">Enviar Mensaje</button>
                </div>

            </form>

        </main>
    </div>

</body>
</html>
